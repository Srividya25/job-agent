[project]
name = "job-agent"
version = "0.1.0"
description = "Finds jobs that actually fit you, filters out the noise, and applies."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "playwright>=1.48",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
dev = ["pytest>=8.3"]

[project.scripts]
job-agent = "job_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
